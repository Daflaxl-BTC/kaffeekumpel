name: Agent — security

on:
  workflow_dispatch:
    inputs:
      task_hint:
        description: "Optional focus for this run (e.g. 'audit auth flow')"
        required: false
        default: ""
  # --- Enable after first successful manual run + secret is set ---
  # schedule:
  #   - cron: "0 7 * * 1"   # weekly Monday 07:00 UTC

concurrency:
  group: agent-security
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ROLE: security
            FOCUS (optional): ${{ github.event.inputs.task_hint }}

            You are the security & architecture reviewer. Find one real weakness
            and fix it: input validation at a boundary, a dependency with a known
            CVE, an auth/permission gap, secret handling, or an architectural seam
            that is causing bugs. Prefer the highest-severity, lowest-blast-radius
            fix. Explain the threat and the fix in the PR. Do not do broad
            speculative refactors.

            HARD RULES (apply to every role):
            - Work on a NEW branch named `agent/security/<yyyy-mm-dd>-<short-slug>`.
            - NEVER commit or push to the default branch. Open a Pull Request instead.
            - Keep the change small and focused — one coherent improvement per run.
            - If tests/lint exist, run them and make them pass before opening the PR.
            - PR description must explain WHAT changed and WHY, and list any risks.
            - If you find nothing worth changing, do NOT open an empty PR — exit cleanly.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm:*),Bash(pnpm:*),Bash(git:*),Bash(gh pr:*)"
